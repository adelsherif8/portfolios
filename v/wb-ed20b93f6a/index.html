<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Adel Atya, intro video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--paper:#F7F4EE;--ink:#16130F;--red:#C63C22;--muted:#6b645b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif;padding:32px max(16px,env(safe-area-inset-left)) 48px}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.label{font:600 12px "Archivo",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{font:400 clamp(34px,5vw,52px)/1.05 "Instrument Serif",Georgia,serif;margin:0}
h1 em{color:var(--red)}
video{width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--ink)}
p{margin:0;color:var(--muted);max-width:62ch}
</style>
</head>
<body>
<main>
  <span class="label">Candidate video &middot; AI Automation Specialist</span>
  <h1>Adel Atya, <em>intro</em></h1>
  <video controls playsinline preload="metadata" poster="poster.jpg">
    <source src="adel-atya-intro.mp4" type="video/mp4">
  </video>
  <p>3 minutes 33 seconds. Background, a production system I own, one design decision, measured impact, and how I use AI tools.</p>
</main>
</body>
</html>
