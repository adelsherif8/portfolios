<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Sign in — Analytics</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="/assets/site.css" />
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:400px;background:var(--paper);border:var(--edge);border-radius:var(--r);box-shadow:var(--hard);padding:34px 30px}
.brand{margin-bottom:22px}
h1{font-size:1.9rem;margin:10px 0 18px}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:8px}
input{width:100%;font:inherit;padding:13px 16px;border-radius:var(--r-sm);border:1px solid rgba(22,19,15,.25);background:#fff}
input:focus{outline:3px solid var(--red);outline-offset:1px}
.btn{width:100%;margin-top:16px;cursor:pointer}
.err{margin-top:14px;color:var(--red);font-weight:600;font-size:.9rem;display:flex;gap:8px;align-items:center}
.note{margin-top:18px;color:var(--grey);font-size:.82rem}
</style>
<script>try{localStorage.setItem("aa_optout","1")}catch(e){}</script>
</head>
<body>
<form class="box" method="post" action="/api/admin/?action=login">
  <a class="brand" href="/"><img src="/favicon.svg" alt="" width="23" height="23" />Adel Atya</a>
  <span class="label">Private</span>
  <h1>Site <em>analytics</em></h1>
  <label for="pw"><i class="fa-solid fa-lock"></i> Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus />
  <button class="btn btn-solid" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
  {{ERROR}}
  <p class="note"><i class="fa-solid fa-eye-slash"></i> This browser is excluded from site analytics.</p>
</form>
</body>
</html>
